<!DOCTYPE html>
<!-- Declare standard HTML5 document type -->
<html lang="en">
  <head>
    <!-- Specify character encoding format as UTF-8 for universal character support -->
    <meta charset="UTF-8" />
    
    <!-- Configure responsive mobile viewport scaling for optimal multi-device display -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Meta description tag for Search Engine Optimization (SEO) -->
    <meta name="description" content="Weekly Report Generator - Standardize team updates, track completed tasks, ongoing items, blockers, and productivity metrics." />
    
    <!-- Application web page title tag -->
    <title>Weekly Report Generator | Team Progress & Accomplishments Tracker</title>

    <!-- Google Fonts preconnect optimization links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Import Google Fonts: Outfit (headings) and Plus Jakarta Sans (body text) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- DOM root target container element where React application renders -->
    <div id="root"></div>

    <!-- Load main JavaScript entry module file -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
